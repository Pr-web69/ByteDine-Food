# ===== Docker 环境配置 =====
# 容器间通过服务名通信
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/lexiang_food?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    password: ${DB_PASSWORD:root123}
  data:
    redis:
      host: redis
      password: ${REDIS_PASSWORD:redis123}
  ai:
    openai:
      api-key: ${AI_API_KEY:}

minio:
  endpoint: http://minio:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  # 前端浏览器访问地址（宿主机映射端口，容器内不可用 minio 服务名）
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}

payment:
  return-url: ${PAY_RETURN_URL:http://localhost/order}